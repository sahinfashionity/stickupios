name: EtiketRadar
options:
  bundleIdPrefix: com.etiketradar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
targets:
  EtiketRadar:
    type: application
    platform: iOS
    sources:
      - EtiketRadar
    resources:
      - EtiketRadar/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etiketradar.app
        INFOPLIST_FILE: EtiketRadar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    info:
      path: EtiketRadar/Info.plist
      properties:
        CFBundleDisplayName: EtiketRadar
        NSCameraUsageDescription: Etiket, ürün veya ilaç kutusu fotoğrafını çekip OCR ile metin algılamak için kamera erişimi gerekir.
        NSPhotoLibraryUsageDescription: Galeriden etiket veya ilaç kutusu fotoğrafı seçebilmek için fotoğraf erişimi gerekir.
        NSPhotoLibraryAddUsageDescription: Sonuç görsellerini kaydetmek için izin istenebilir.
